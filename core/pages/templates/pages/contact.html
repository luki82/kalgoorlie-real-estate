{% extends 'layouts/base.html' %}

{% block content %}
<section id="contact" class="py-5 bg-light">
  <div class="container">
    <div class="row">
      
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm h-100 border-0">
          <div class="card-body p-4">
            <h4 class="mb-4 text-primary">Get In Touch</h4>
            
            <div class="d-flex align-items-start mb-3">
                <i class="fas fa-map-marker-alt fa-2x text-danger me-3"></i>
                <div>
                    <h6 class="fw-bold mb-1">Our Office</h6>
                    <p class="text-muted mb-0">
                        118 Forrest Street<br>
                        South Boulder, WA 6432
                    </p>
                </div>
            </div>

            <div class="d-flex align-items-start mb-3">
                <i class="fas fa-phone-alt fa-2x text-danger me-3"></i>
                <div>
                    <h6 class="fw-bold mb-1">Phone</h6>
                    <p class="text-muted mb-0">+61 400 000 000</p>
                </div>
            </div>

            <div class="d-flex align-items-start mb-4">
                <i class="fas fa-envelope fa-2x text-danger me-3"></i>
                <div>
                    <h6 class="fw-bold mb-1">Email</h6>
                    <p class="text-muted mb-0">info@auestate.com.au</p>
                </div>
            </div>

            <hr>

           
            

          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card shadow-sm h-100 border-0">
          <div class="card-header bg-danger text-white">
            <h4 class="mb-0"><i class="fas fa-envelope"></i> Send us a Message</h4>
          </div>
          <div class="card-body p-4">
            
            <form action="{% url 'contact' %}" method="POST">
              {% csrf_token %}
              
              <div class="form-group mb-3">
                <label class="fw-bold">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your Full Name" required>
              </div>

              <div class="form-group mb-3">
                <label class="fw-bold">Email</label>
                <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
              </div>

              <div class="form-group mb-3">
                <label class="fw-bold">Subject</label>
                <input type="text" name="subject" class="form-control" placeholder="Property Inquiry">
              </div>

              <div class="form-group mb-3">
                <label class="fw-bold">Message</label>
                <textarea name="message" class="form-control" rows="5" placeholder="How can we help you?" required></textarea>
              </div>

              <input type="submit" value="Send Message" class="btn btn-secondary w-100">
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
{% endblock %}
