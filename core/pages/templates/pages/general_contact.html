{% extends 'layouts/base.html' %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Get a drafting quote</h4>
          </div>
          <div class="card-body">
            
            <form action="{% url 'general_contact' %}" method="POST">
              {% csrf_token %}
              
              <div style="display: none;">
                  <label for="website_url">Leave this field blank if you are human:</label>
                  <input type="text" name="website_url" id="website_url" autocomplete="off">
              </div>
              
              <div class="form-group mb-3">
                <label>Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label>Email</label>
                  <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label>Phone</label>
                  <input type="tel" name="phone" class="form-control">
                </div>
              </div>

              <div class="form-group mb-3">
                <label>Subject</label>
                <input type="text" name="subject" class="form-control" value="{{ request.GET.subject|default:'Drafting quote' }}" required>
              </div>

              <div class="form-group mb-3">
                <label>Message</label>
                <textarea name="message" class="form-control" rows="5" required placeholder="Property address, what you want to build (e.g. new house, extension, shed), and any sketches or ideas you already have."></textarea>
              </div>

              <button type="submit" class="btn btn-danger fw-bold w-100">Send quote request</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
