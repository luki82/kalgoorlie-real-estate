{% extends 'base.html' %}

{% block title %} | Payment Cancelled {% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-sm border-0 rounded-lg mt-5">
          <div class="card-body p-5 text-center">
            
            <div class="mb-4">
              <i class="fas fa-times-circle text-danger" style="font-size: 5rem;"></i>
            </div>

            <h2 class="h3 font-weight-bold text-danger mb-3">Payment Cancelled</h2>
            
            <p class="text-muted mb-4">
              You have <strong>not</strong> been charged. <br>
              Your listing remains in "Draft" status and is not visible to the public.
            </p>

            <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">
              Return to Dashboard
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
