{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Confirm & Pay</h4>
                </div>
                <div class="card-body">
                    <h5 class="card-title">{{ listing.title }}</h5>
                    <p class="text-muted">{{ listing.address }}</p>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="font-weight-bold">Activation Fee</span>
                        <span class="font-weight-bold">${{ fee }} AUD</span>
                    </div>

                    <form action="{% url 'payment_view' listing.id %}" method="POST" id="payment-form">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label for="card-element">Credit or Debit Card</label>
                            <div id="card-element" class="form-control p-3">
                                </div>
                            <div id="card-errors" role="alert" class="text-danger mt-2"></div>
                        </div>

                        <button class="btn btn-success btn-block mt-4" id="submit-btn">
                            Pay ${{ fee }} & Publish
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
    // 1. Initialize Stripe with your Public Key
    // Note: We use the key name we passed from views.py context
    var stripe = Stripe('{{ STRIPE_PUBLIC_KEY }}'); 
    var elements = stripe.elements();

    // 2. Create the Card Element style
    var style = {
        base: {
            color: '#32325d',
            fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': {
                color: '#aab7c4'
            }
        },
        invalid: {
            color: '#fa755a',
            iconColor: '#fa755a'
        }
    };

    // 3. Mount the Element
    var card = elements.create('card', {style: style});
    card.mount('#card-element');

    // 4. Handle Real-time Validation Errors
    card.on('change', function(event) {
        var displayError = document.getElementById('card-errors');
        if (event.error) {
            displayError.textContent = event.error.message;
        } else {
            displayError.textContent = '';
        }
    });

    // 5. Handle Form Submission
    var form = document.getElementById('payment-form');
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Disable button to prevent double clicks
        document.getElementById('submit-btn').disabled = true;

        stripe.createToken(card).then(function(result) {
            if (result.error) {
                // Inform the user if there was an error
                var errorElement = document.getElementById('card-errors');
                errorElement.textContent = result.error.message;
                document.getElementById('submit-btn').disabled = false;
            } else {
                // Send the token to your server
                stripeTokenHandler(result.token);
            }
        });
    });

    // 6. Submit the Token to Django
    function stripeTokenHandler(token) {
        var form = document.getElementById('payment-form');
        var hiddenInput = document.createElement('input');
        hiddenInput.setAttribute('type', 'hidden');
        hiddenInput.setAttribute('name', 'stripeToken');
        hiddenInput.setAttribute('value', token.id);
        form.appendChild(hiddenInput);
        form.submit();
    }
</script>
{% endblock %}
