{% extends 'base.html' %}

{% block title %} | Payment Successful {% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-lg border-0 rounded-lg mt-5">
          <div class="card-body p-5 text-center">
            
            <div class="mb-4">
              <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
            </div>

            <h2 class="h3 font-weight-bold text-success mb-3">Payment Successful!</h2>
            
            <p class="lead mb-4">
              Congratulations! Your listing <br>
              <strong>"{{ listing.title }}"</strong> <br>
              is now officially <strong>LIVE</strong> on AuEstate.
            </p>

            <hr class="my-4">

            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'listing' listing.id %}" class="btn btn-success btn-lg mx-2">
                <i class="fas fa-eye"></i> View Listing
              </a>
              <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg mx-2">
                Back to Dashboard
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
