{% extends 'layouts/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0"><i class="fas fa-credit-card me-2"></i>Secure Checkout</h3>
            </div>
            <div class="card-body p-4 text-center">
                <h5>Publishing Fee for:</h5>
                <h3 class="fw-bold">{{ listing.title }}</h3>
                <hr>
                <h1 class="display-4 text-success">${{ fee }}</h1>
                <p class="text-muted">Once paid, your listing will be sent to Admin for approval.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success btn-lg w-100 mt-3">
                        Pay ${{ fee }} & Submit
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-link text-muted mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
