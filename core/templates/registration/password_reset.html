{% extends 'layouts/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="col-md-6 m-auto border p-4 shadow-sm bg-white">
        <h3>Forgot Password?</h3>
        <p>Enter your email below to receive a reset link.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-danger w-100">Send Reset Email</button>
        </form>
    </div>
</div>
{% endblock %}
