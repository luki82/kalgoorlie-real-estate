# Render Blueprint for the drafting website.
# In Render: New + > Blueprint > pick this repository.
databases:
  - name: drafting-db
    plan: basic-256mb
    region: singapore
    databaseName: drafting
    user: drafting

services:
  - type: web
    name: drafting-site
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "bash build.sh"
    startCommand: "cd core && gunicorn core.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: LIVE_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drafting-db
          property: connectionString
      # Your own domain(s), comma-separated, e.g. "example.com.au,www.example.com.au".
      # The onrender.com address works without this.
      - key: ALLOWED_HOSTS
        sync: false
      # Contact form email (Office 365 / Outlook by default).
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # First admin login, created on the first deploy.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
